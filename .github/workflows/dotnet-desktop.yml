name: Build and Release

on:
  push:
    tags:
      - "xslt-editor/v*"
  workflow_dispatch:

env:
  PROJECT_PATH: src/XsltEditor/XsltEditor.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:PublishReadyToRun=true `
            -p:PublishTrimmed=false `
            -p:WindowsPackageType=None `
            -p:IncludeAllContentForSelfExtract=true `
            -o XsltEditor/bin/Release/net8.0-windows7.0/x64
            
      - name: Zip Release
        shell: pwsh
        run: Compress-Archive -Path XsltEditor/bin/Release/net8.0-windows7.0/x64/* -DestinationPath x64_release.zip
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            x64_release.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}