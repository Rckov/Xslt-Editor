name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Run Nuke build
        run: dotnet run --project build/Build.csproj

      - name: Archive app
        shell: pwsh
        run: Compress-Archive -Path out/app/* -DestinationPath xslt-editor.zip

      - name: Archive plugins
        shell: pwsh
        run: Compress-Archive -Path out/plugins/* -DestinationPath plugins.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xslt-editor.zip
            plugins.zip
          draft: false
          prerelease: false
          generate_release_notes: true
